[package]
name = "geocore"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
        "src/*"
]

[lib]
name = "geocore"
crate-type = ["staticlib", "cdylib", "lib"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
num = "0.4"
xml-rs = "0.8"
chrono = { version = "0.4", features = ["alloc", "std", "clock"] }
bitfield = "0.14.0"
xmlwriter = "0.1.0"


